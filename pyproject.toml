[build-system]
requires = [
    "setuptools", 
    "numpy",
    "cython", 
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "starslugs"
version = "0.0.2"
dependencies = [
    "numpy",
    "astropy",
    "scipy",
    "matplotlib",
    "deprecation",
    "pytest",
    "pandas",
    "astroquery"
]

[tool.setuptools.packages.find]
include = ["starslugs*"]
exclude = ["data*", "test_branch*"]
namespaces = false